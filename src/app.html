<!doctype html>
<html lang="en" data-graph-theme="dark" data-accent="fractal" data-accent-kind="solid">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Restore the saved accent before first paint. Keep ids in sync
			// with src/site/lib/accents.ts.
			(function () {
				try {
					var i = localStorage.getItem('fractalgraphy-accent');
					var kinds = {
						fractal: 'solid',
						mono: 'solid',
						mint: 'solid',
						orange: 'solid',
						green: 'solid',
						cyan: 'solid',
						blue: 'solid',
						purple: 'solid',
						pink: 'solid',
						sunset: 'gradient',
						ocean: 'gradient',
						neon: 'gradient',
						aurora: 'gradient',
						fire: 'gradient',
						prism: 'gradient'
					};
					if (!(i in kinds)) i = 'fractal';
					document.documentElement.setAttribute('data-accent', i);
					document.documentElement.setAttribute('data-accent-kind', kinds[i]);
				} catch (e) {
					/* defaults already set on <html> */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
